version: 1
frontend:
  phases:
    preBuild:
      commands:
        # A cache saved before the change below may still carry .next/cache.
        - rm -rf .next/cache
        # The Node in .nvmrc: the Astryx CLI that builds the theme needs >= 22.13.
        # Without the flag, nvm also installs the image's default global
        # packages (Amplify CLI, cypress, vuepress, hugo...), a minute the
        # build has no use for.
        - nvm install --skip-default-packages
        - nvm use
        - npm ci --cache .npm --prefer-offline
        # npm test runs the infra stack's tests too, and the store's against
        # DynamoDB Local, which needs the Java installed below.
        - npm ci --prefix infra --cache .npm --prefer-offline
        # The accessibility tests need a headless Chromium, and Java for
        # DynamoDB Local. The image has no Java and the build is not root, so
        # Amazon Corretto 17 is unpacked into the project instead. Both live
        # inside the project so the build cache below carries them over.
        - export PLAYWRIGHT_BROWSERS_PATH="$PWD/.playwright-browsers"
        - npx playwright install chromium
        # A pinned release, checked against Corretto's published sha256, so a
        # new release or a bad download cannot change or break the gate.
        - export JDK=17.0.20.12.1 JDK_SHA256=b852a8bc8890149c71141e784cde160d7ecb09bfa82b71209179b25902a0ebe3
        - '[ -x .jdk/bin/java ] || (curl -fsSL -o jdk.tar.gz "https://corretto.aws/downloads/resources/$JDK/amazon-corretto-$JDK-linux-x64.tar.gz" && echo "$JDK_SHA256  jdk.tar.gz" | sha256sum -c - && mkdir -p .jdk && tar -xzf jdk.tar.gz -C .jdk --strip-components=1 && rm jdk.tar.gz)'
        - export PATH="$PWD/.jdk/bin:$PATH"
        - java -version
    build:
      commands:
        # Amplify's environment variables reach the build, not the SSR
        # runtime. Next loads .env.production at runtime, so the server-side
        # ones are copied there. Only these names: nothing else from the
        # build environment should end up in the artifact.
        - env | grep -E '^(PLAYERS_TABLE_NAME|PLAYERS_TABLE_REGION|CRON_SECRET|AUTH_SECRET|AUTH_GOOGLE_ID|AUTH_GOOGLE_SECRET|AUTH_URL|STREAM_URL|STREAM_SECRET)=' >> .env.production || true
        # Every test must pass for the build to conclude, and so to deploy:
        # the unit, store and infra tests first, then the accessibility tests
        # against the very build that is about to be deployed. They run it
        # against DynamoDB Local in its own table, never the real one, and
        # against a fake Coinbase, so no test calls anything outside the
        # build. What the build downloads - npm packages, Playwright's
        # Chromium, Corretto and DynamoDB Local - is pinned (the last two by
        # checksum) and cached between builds.
        # The type-check comes first and alone: the build rewrites .next/types,
        # which tsconfig.json includes. The unit, store and infra tests share
        # nothing with the build, so they run beside it; either failing fails
        # the step.
        # A quiet log: no colour codes (the log viewer does not render them)
        # and one dot per passing test file instead of a line per slow test.
        # Failures are still printed in full.
        - export NO_COLOR=1 FORCE_COLOR=0 VITEST_REPORTER=dot
        - npm run typecheck
        - npm run test:unit & unit=$!; npm run build & build=$!; wait $unit && wait $build
        - E2E_PREBUILT=1 npm run test:a11y
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    # Not .next/cache: Turbopack's cache holds absolute paths, and each
    # Amplify build checks out to a different directory, so a restored cache
    # points at files from the previous build ("Cannot find module
    # .../babel.config.js").
    paths:
      - .npm/**/*
      - .playwright-browsers/**/*
      - .jdk/**/*
      - .dynamodb/*.jar
      - .dynamodb/DynamoDBLocal_lib/**/*
