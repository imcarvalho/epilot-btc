version: 1
frontend:
  phases:
    preBuild:
      commands:
        # A cache saved before the change below may still carry .next/cache.
        - rm -rf .next/cache
        # The Node in .nvmrc: the Astryx CLI that builds the theme needs >= 22.13.
        - nvm install
        - nvm use
        - npm ci --cache .npm --prefer-offline
        # npm test runs the infra stack's tests too.
        - npm ci --prefix infra --cache .npm --prefer-offline
        # The accessibility tests: a headless Chromium, kept inside the project
        # so the build cache below can carry it between builds, and Java for
        # DynamoDB Local, installed only if the image lacks it.
        - export PLAYWRIGHT_BROWSERS_PATH="$PWD/.playwright-browsers"
        - npx playwright install chromium
        - java -version || dnf install -y java-17-amazon-corretto-headless
    build:
      commands:
        # Amplify's environment variables reach the build, not the SSR
        # runtime. Next loads .env.production at runtime, so the server-side
        # ones are copied there. Only these names: nothing else from the
        # build environment should end up in the artifact.
        - env | grep -E '^(PLAYERS_TABLE_NAME|PLAYERS_TABLE_REGION|CRON_SECRET|AUTH_SECRET|AUTH_GOOGLE_ID|AUTH_GOOGLE_SECRET|AUTH_URL)=' >> .env.production || true
        # Every test must pass for the build to conclude, and so to deploy:
        # the unit and infra tests first, then the accessibility tests against
        # the very build that is about to be deployed. They run it against
        # DynamoDB Local in its own table, never the real one.
        - npm test
        - npm run build
        - E2E_PREBUILT=1 npm run test:a11y
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    # Not .next/cache: Turbopack's cache holds absolute paths, and each
    # Amplify build checks out to a different directory, so a restored cache
    # points at files from the previous build ("Cannot find module
    # .../babel.config.js").
    paths:
      - .npm/**/*
      - .playwright-browsers/**/*
      - .dynamodb/*.jar
      - .dynamodb/DynamoDBLocal_lib/**/*
